name: Probe

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to test
        required: false
        default: main

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: yunseen/skrrt
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: app

      - name: Select Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec ci/tests.yml

      - name: Run probe
        run: |
          mkdir -p out
          name=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone (1[7-9]|[2-9][0-9])( Pro)?' | head -1)
          echo "Using $name"
          set +e
          xcodebuild test \
            -project ci/Skrrt.xcodeproj \
            -scheme Skrrt \
            -destination "platform=iOS Simulator,name=$name" \
            -resultBundlePath out/result.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -n 150
          exit 0

      - name: Collect
        if: always()
        run: |
          xcrun xcresulttool export attachments --path out/result.xcresult --output-path out/attachments || true
          xcrun xcresulttool export diagnostics --path out/result.xcresult --output-path out/diagnostics || true
          sleep 5
          cp ~/Library/Logs/DiagnosticReports/*.ips out/ 2>/dev/null || true
          rm -rf out/result.xcresult

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ inputs.ref }}
          path: out
